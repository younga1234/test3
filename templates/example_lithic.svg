  </metadata>

  
  <g inkscape:label="01_OUTLINE" inkscape:groupmode="layer" id="layer01-outline" style="display:inline">
    <title>외곽선 레이어 - 석기 외곽 윤곽선 (0.45mm)</title>
    
  <ellipse cx="80" cy="100" rx="30" ry="50" style="fill:none;stroke:#000000;stroke-width:0.45mm;stroke-linecap:round;stroke-linejoin:round" class="outline" /></g>

  
  <g inkscape:label="02_SCARS" inkscape:groupmode="layer" id="layer02-scars" style="display:inline">
    <title>박리흔 경계선 레이어 - 격지 제거 흔적 경계 (0.30mm)</title>
    
  </g>

  
  <g inkscape:label="03_RIPPLES" inkscape:groupmode="layer" id="layer03-ripples" style="display:inline">
    <title>파상선 레이어 - 박리면 파상 무늬 (0.20mm, 선택)</title>
    
  </g>

  
  <g inkscape:label="04_CORTEX" inkscape:groupmode="layer" id="layer04-cortex" style="display:inline">
    <title>코르텍스 점묘 레이어 - 자연면 표현 (0.18mm 점)</title>
    
  </g>

  
  <g inkscape:label="05_SECTION" inkscape:groupmode="layer" id="layer05-section" style="display:inline">
    <title>단면 레이어 - 세로 단면도 (우측 배치, 윤곽 0.45mm, 해칭 0.20mm)</title>
    
  <path d="M 130,80 L 150,80 L 155,100 L 150,130 L 130,130 Z" style="fill:none;stroke:#000000;stroke-width:0.45mm;stroke-linecap:round;stroke-linejoin:round" class="section-outline" /></g>

  
  <g inkscape:label="06_LINKS" inkscape:groupmode="layer" id="layer06-links" style="display:inline">
    <title>연결선 레이어 - 뷰 간 수평 연결선 (0.15mm)</title>
    
  <line x1="110" y1="90" x2="130" y2="90" style="stroke:#000000;stroke-width:0.15mm;stroke-linecap:round" class="linking" /><line x1="110" y1="120" x2="130" y2="120" style="stroke:#000000;stroke-width:0.15mm;stroke-linecap:round" class="linking" /></g>

  
  <g inkscape:label="07_SYMBOLS" inkscape:groupmode="layer" id="layer07-symbols" style="display:inline">
    <title>기호 레이어 - 스케일바, 북화살표, 방향 표시</title>
    
  <g id="scalebar-instance" transform="translate(50, 250)"><rect x="0" y="0" width="2" height="4" fill="#000000" stroke="none" /><rect x="2" y="0" width="2" height="4" fill="none" stroke="#000000" stroke-width="0.3" /><rect x="4" y="0" width="2" height="4" fill="#000000" stroke="none" /><rect x="6" y="0" width="2" height="4" fill="none" stroke="#000000" stroke-width="0.3" /><rect x="8" y="0" width="2" height="4" fill="#000000" stroke="none" /><text x="9" y="7" style="font-family:sans-serif;font-size:2mm;fill:#000000" text-anchor="end">1 cm</text></g></g>

  
  <g inkscape:label="08_LABELS" inkscape:groupmode="layer" id="layer08-labels" style="display:inline">
    <title>라벨 레이어 - 텍스트 주석 및 식별 번호 (7-9pt)</title>
    
  <text x="80" y="30" class="label-text" style="font-family:sans-serif;font-size:8pt;fill:#000000;text-anchor:middle">예제 석기 - Example001</text></g>

  
  <g inkscape:label="09_LEGEND" inkscape:groupmode="layer" id="layer09-legend" style="display:inline">
    <title>범례 레이어 - 기호 설명 및 주석</title>
    
  <text x="160" y="270" style="font-family:sans-serif;font-size:3mm;fill:#000000"><tspan x="160" dy="0">American Projection</tspan><tspan x="160" dy="4">예제 도면</tspan></text></g>

  
  <g inkscape:label="10_GUIDES" inkscape:groupmode="layer" id="layer10-guides" style="display:none">
    <title>가이드 레이어 - 참조 이미지 및 보조선 (비출력)</title>
    
  </g>

  
  </svg>