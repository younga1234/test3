<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:cc="http://creativecommons.org/ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd" width="210mm" height="297mm" viewBox="0 0 210 297" version="1.1" id="svg1" inkscape:version="1.3" sodipodi:docname="lithic_min.svg">
  <defs id="defs1">
    
    <style type="text/css" id="lithic-standard-styles">
      .outline {
        fill: none;
        stroke: #000000;
        stroke-width: 0.45mm;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .scar {
        fill: none;
        stroke: #000000;
        stroke-width: 0.30mm;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .ripple {
        fill: none;
        stroke: #000000;
        stroke-width: 0.20mm;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .linking {
        fill: none;
        stroke: #000000;
        stroke-width: 0.15mm;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .section-outline {
        fill: none;
        stroke: #000000;
        stroke-width: 0.45mm;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .section-hatching {
        fill: none;
        stroke: #000000;
        stroke-width: 0.20mm;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .cortex-stipple {
        fill: #000000;
        stroke: none;
      }
      .label-text {
        font-family: 'Noto Sans CJK KR', 'Liberation Sans', 'Arial', sans-serif;
        font-size: 8pt;
        fill: #000000;
        stroke: none;
      }
    </style>

    
    <pattern id="cortex-stipple-pattern" patternUnits="userSpaceOnUse" width="2" height="2">
      <circle cx="1" cy="1" r="0.18" fill="#000000" />
    </pattern>

    
    <pattern id="section-hatching-pattern" patternUnits="userSpaceOnUse" width="2" height="2" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="2" stroke="#000000" stroke-width="0.20" />
    </pattern>
  </defs>

  <sodipodi:namedview id="namedview1" pagecolor="#ffffff" bordercolor="#000000" borderopacity="1.0" inkscape:showpageshadow="2" inkscape:pageopacity="0" inkscape:pagecheckerboard="0" inkscape:deskcolor="#d1d1d1" inkscape:document-units="mm" showgrid="true" inkscape:zoom="1" inkscape:cx="400" inkscape:cy="400" inkscape:window-width="1920" inkscape:window-height="1080" inkscape:window-x="0" inkscape:window-y="0" inkscape:window-maximized="1" inkscape:current-layer="layer01-outline">
    <inkscape:grid type="xygrid" id="grid1" units="mm" spacingx="1" spacingy="1" empspacing="10" enabled="true" visible="true" snapvisiblegridlinesonly="true" />
  </sodipodi:namedview>

  <metadata id="metadata1">
    <rdf:RDF>
      <cc:Work rdf:about="">
        <dc:format>image/svg+xml</dc:format>
        <dc:type rdf:resource="http://purl.org/dc/dcmitype/StillImage" />
